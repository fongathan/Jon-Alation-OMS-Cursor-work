<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navigator – Privacy & Data Governance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2e4a;
    --navy-dark: #0f1e33;
    --blue-btn: #1a3a5c;
    --accent: #1a3a5c;
    --border: #d8dee8;
    --bg: #eef0f5;
    --card-bg: #ffffff;
    --text: #1a2e4a;
    --muted: #6b7a99;
    --active-border: #1a3a5c;
    --pill-active-bg: #1a3a5c;
    --pill-active-text: #ffffff;
    --tab-active: #1a3a5c;
    --sidebar-w: 240px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top nav bar ── */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    height: 52px;
    gap: 12px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar .hamburger {
    cursor: pointer;
    display: flex; flex-direction: column; gap: 4px; padding: 4px;
  }
  .topbar .hamburger span {
    display: block; width: 18px; height: 2px; background: var(--navy);
  }
  .breadcrumb {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .breadcrumb span {
    color: var(--muted);
    font-weight: 400;
    margin-left: 6px;
  }
  .breadcrumb span::before { content: '/ '; color: var(--border); margin-right: 6px; }
  .topbar-right {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* ── Buttons ── */
  .btn-outline {
    background: #fff; border: 1px solid var(--border); color: var(--navy);
    padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: box-shadow .15s;
  }
  .btn-outline:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .btn-primary {
    background: var(--blue-btn); color: #fff; border: none;
    padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: var(--navy-dark); }

  /* ── Hero (slim) ── */
  .hero {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }
  .hero-title-block .hero-label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 2px;
  }
  .hero-title-block .hero-title {
    font-size: 22px; font-weight: 700; color: var(--navy);
  }
  .hero-search {
    flex: 1; max-width: 480px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 40px;
    display: flex; align-items: center; padding: 0 16px; height: 40px;
  }
  .hero-search input {
    border: none; outline: none; width: 100%; font-size: 13px;
    color: var(--text); background: transparent;
  }
  .hero-search input::placeholder { color: #aab2c8; }

  /* ── Body layout ── */
  .body-layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: #fff;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    overflow-y: auto;
    padding: 16px 0 32px;
  }

  .sidebar-section { }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    cursor: pointer;
    user-select: none;
    border-radius: 0;
    transition: background .12s;
  }
  .section-header:hover { background: #f5f7fa; }
  .section-header-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-header.has-active .section-header-label {
    color: var(--navy);
  }
  .chevron {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
    flex-shrink: 0;
  }
  .chevron svg { display: block; }
  .section-header.open .chevron { transform: rotate(180deg); }

  .section-items {
    display: none;
    padding: 2px 0 8px;
  }
  .section-items.open { display: block; }

  .nav-item {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 8px 20px 8px 28px;
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .1s, color .1s;
    position: relative;
  }
  .nav-item:hover { background: #f5f7fa; }
  .nav-item.active {
    border-left-color: var(--active-border);
    background: #f0f4fa;
    color: var(--active-border);
    font-weight: 600;
  }

  /* ── Main content ── */
  .main {
    flex: 1;
    padding: 28px 32px 48px;
    overflow-y: auto;
    min-width: 0;
  }

  /* ── Content panel ── */
  .content-panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    animation: fadeIn .2s ease;
  }
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .tab {
    padding: 14px 4px; margin-right: 28px;
    font-size: 14px; font-weight: 500; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .12s;
  }
  .tab.active { color: var(--tab-active); border-bottom-color: var(--tab-active); font-weight: 600; }
  .tab:hover:not(.active) { color: var(--navy); }

  .tab-content { display: none; padding: 28px 24px; }
  .tab-content.active { display: block; }

  .section-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .section-subtitle { font-size: 16px; font-weight: 600; margin: 18px 0 8px; }
  .section-desc { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 640px; margin-bottom: 20px; }

  /* Filter pills */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
  .filter-label { font-size: 13px; color: var(--muted); font-weight: 500; margin-right: 4px; }
  .pill {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: #fff; color: var(--navy);
    cursor: pointer; transition: all .12s;
  }
  .pill:hover { background: #f0f4fa; }
  .pill.active { background: var(--pill-active-bg); color: var(--pill-active-text); border-color: var(--pill-active-bg); }

  /* Table */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); background: #f8f9fc; border-bottom: 1px solid var(--border);
  }
  .data-table td { padding: 12px 16px; border-bottom: 1px solid #f0f2f7; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #fafbfd; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: #e3f5ec; color: #1a7a45; }
  .badge-yellow { background: #fef3cd; color: #856404; }
  .badge-red { background: #fde8e8; color: #9b1c1c; }
  .badge-blue { background: #e0eaff; color: #1a3a8f; }

  /* Work queue */
  .queue-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid #f0f2f7;
  }
  .queue-item:last-child { border-bottom: none; }
  .queue-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .queue-meta { font-size: 12px; color: var(--muted); }
  .queue-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .priority { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .priority-high { background: #fde8e8; color: #9b1c1c; }
  .priority-med { background: #fef3cd; color: #856404; }
  .priority-low { background: #e3f5ec; color: #1a7a45; }
  .due { font-size: 12px; color: var(--muted); }

  /* Stat row */
  .stats-row { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat-card {
    flex: 1; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; background: #fafbfd;
  }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--navy); }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Consent dashboard ── */
  .overview-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .stat-grid-8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .activities-box { background: #f5f7fb; border: 1px solid #ccd4e4; border-radius: 14px; padding: 16px 18px 18px; margin-bottom: 20px; }
  .activities-box-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .stat-card-v2 { border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; background: #fff; text-align: center; }
  .stat-card-v2 .sv { font-size: 24px; font-weight: 700; color: #1a2e6e; }
  .stat-card-v2 .sl { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { border: 1px solid var(--border); border-radius: 12px; padding: 20px; background: #fff; }
  .chart-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .chart-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  /* Key controls */
  .control-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; background: #fff; }
  .control-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 6px; }
  .control-name { font-size: 14px; font-weight: 700; color: var(--navy); }
  .control-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .control-meta { display: flex; gap: 48px; }
  .control-meta-item .cml { font-size: 11px; font-weight: 600; color: var(--navy); margin-bottom: 2px; }
  .control-meta-item .cmv { font-size: 13px; color: var(--text); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .tag { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 4px; letter-spacing: .04em; white-space: nowrap; }
  .tag-high-risk { background: #fff0f0; color: #c0392b; border: 1px solid #f5c0c0; }
  .tag-med-risk { background: #fff8e6; color: #c87d0e; border: 1px solid #fce4a0; }
  .tag-compliant { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
  .tag-inprogress { background: #eaf4ff; color: #1a6bb5; border: 1px solid #a9d0f0; }
  .tag-automated { background: #f4f0ff; color: #6c3483; border: 1px solid #d2b4de; }
  .tag-manual { background: #f4f0ff; color: #6c3483; border: 1px solid #d2b4de; }
  /* Reports */
  .reports-section { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
  .reports-title { font-size: 15px; font-weight: 700; color: var(--navy); padding: 16px 20px 0; }
  .rpt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rpt-table th { text-align: left; padding: 10px 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: #f8f9fc; border-bottom: 1px solid var(--border); }
  .rpt-table td { padding: 13px 20px; border-bottom: 1px solid #f0f2f7; }
  .rpt-table tr:last-child td { border-bottom: none; }
  .rpt-table td:first-child { font-weight: 600; }
  .btn-open { background: #fff; border: 1px solid var(--border); color: var(--navy); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-open:hover { background: #f5f7fa; }
  /* By persona */
  .persona-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .persona-card { border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; background: #fff; }
  .persona-type { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b4fcf; margin-bottom: 6px; }
  .persona-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
  .persona-links a { display: block; font-size: 13px; color: #5b4fcf; text-decoration: none; margin-bottom: 6px; font-weight: 500; }
  .persona-links a:hover { text-decoration: underline; }

  /* ── DSR dashboard ── */
  .dsr-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .dsr-outer { border: 1px solid var(--border); border-radius: 12px; padding: 20px; background: var(--bg); }
  .dsr-outer-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .dsr-outer-ttl { font-size: 15px; font-weight: 700; color: var(--navy); }
  .chart-inner { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .ci-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .ci-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .dsr-chips { display: flex; gap: 6px; }
  .dsr-chip { background: #fff; border: 1px solid var(--border); color: var(--navy); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .dsr-chip:hover { background: #f0f4fa; }
  .type-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .tp { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; color: #4a5568; }
  .tp-purple { background: #c0b4e0; } .tp-yellow { background: #e6ce90; } .tp-blue { background: #96cce0; } .tp-green { background: #96d0ae; }
  .vol-legend { display: flex; gap: 10px; margin-top: 12px; }
  .vc { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 4px; color: #fff; }
  .vc-green { background: #22C55E; } .vc-dark { background: #1a2e4a; }
  .pie-legend { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
  .pie-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--navy); }
  .pie-dot { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
  /* Region totals */
  .region-totals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .rc { border-radius: 10px; padding: 16px 18px; border: 1px solid rgba(0,0,0,0.07); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .rc-label { font-size: 10px; font-weight: 800; letter-spacing: .06em; }
  .rc-val { font-size: 20px; font-weight: 700; }
  /* Status pipeline */
  .status-pipeline { display: block; width: 100%; }
  .sp-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .sp-val { font-size: 20px; font-weight: 700; }

  /* ── Governance Overview ── */
  .gov-4col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .gov-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .gov-metric-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px 20px 16px; position: relative; display: flex; flex-direction: column; min-height: 148px; }
  .gov-metric-card.clickable { cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
  .gov-metric-card.clickable:hover { box-shadow: 0 4px 16px rgba(26,46,74,0.12); border-color: #4f7fe8; }
  .gov-info { position: absolute; top: 12px; right: 14px; color: #b8c2d4; font-size: 14px; cursor: help; }
  .gov-metric-name { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 10px; padding-right: 20px; line-height: 1.35; min-height: 52px; }
  .pci-section-box { background: #fbfcfe; border: 1px solid #e4e8f0; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .gov-metric-val { font-size: 40px; font-weight: 800; color: #8896b3; line-height: 1; text-align: center; }
  .gov-4col .gov-metric-val { color: var(--navy); }
  .gov-metric-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: auto; padding-top: 12px; }
  .gov-section { margin-bottom: 28px; }
  .gov-divider { border: none; border-top: 1px solid #d0d6e2; margin: 28px 0; }
  .gov-section-ttl { font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .gov-section-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .gov-index-row { display: grid; grid-template-columns: 1fr 2.6fr; gap: 16px; }
  .gov-index-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .gov-index-name { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .gov-index-val { font-size: 40px; font-weight: 800; color: var(--navy); }
  .gov-trend-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  /* ── PCI formula bar ── */
  .pci-formula-wrap { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .pci-bar { display: flex; border-radius: 8px; overflow: hidden; height: 44px; margin-bottom: 14px; }
  .pci-seg { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: 1; letter-spacing: .02em; }
  .pci-seg-crr  { background: #4f7fe8; }
  .pci-seg-tcea { background: #7c5cbf; }
  .pci-seg-der  { background: #2a9d8f; }
  .pci-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .pci-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy); }
  .pci-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .pci-result-banner { background: #dce2ee; border: 1px solid #c4cde0; border-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
  .pci-result-label { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .pci-result-sub { font-size: 13px; color: var(--muted); }
  .pci-result-val { font-size: 40px; font-weight: 800; color: var(--navy); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- Top nav -->
<nav class="topbar">
  <div class="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </div>
  <div class="breadcrumb">
    Navigator <span id="breadcrumb-section">Governance Overview</span>
  </div>
  <div class="topbar-right">
    <button class="btn-outline">Open auditor view</button>
    <button class="btn-primary">Export evidence package</button>
  </div>
</nav>

<!-- Slim hero -->
<div class="hero">
  <div class="hero-title-block" style="display:flex;align-items:center;gap:12px">
    <svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" style="width:52px;height:52px;flex-shrink:0">
      <defs>
        <linearGradient id="logoArmL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#82aece"/><stop offset="100%" stop-color="#a8c8e0"/></linearGradient>
        <linearGradient id="logoArmR" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8eb8d0"/><stop offset="100%" stop-color="#b0ceE4"/></linearGradient>
        <linearGradient id="logoNodeBig" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#80accc"/><stop offset="100%" stop-color="#a4c4dc"/></linearGradient>
        <linearGradient id="logoNodeSmR" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#88b0cc"/><stop offset="100%" stop-color="#aacadc"/></linearGradient>

// ── State ──────────────────────────────────────────────────────────────────
let activeSection = { category: 'overview', item: 'home' };
let activeTab = 'overview';

// ── Toggle section collapse ────────────────────────────────────────────────
function toggleSection(category) {
  const header = document.querySelector(`#section-${category} .section-header`);
  const items = document.getElementById(`items-${category}`);
  const isOpen = items.classList.contains('open');
  if (isOpen) {
    items.classList.remove('open');
    header.classList.remove('open');
  } else {
    items.classList.add('open');
    header.classList.add('open');
  }
}

// ── Navigate ───────────────────────────────────────────────────────────────
function navigate(category, item) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.section-header').forEach(el => el.classList.remove('has-active'));

  const allBtns = document.querySelectorAll('.nav-item');
  allBtns.forEach(btn => {
    if (btn.getAttribute('onclick') === `navigate('${category}','${item}')`) {
      btn.classList.add('active');
    }
  });

  const header = document.querySelector(`#section-${category} .section-header`);
  if (header) header.classList.add('has-active');

  // Ensure section is expanded
  const items = document.getElementById(`items-${category}`);
  if (items && !items.classList.contains('open')) {
    items.classList.add('open');
    if (header) header.classList.add('open');
  }

  activeSection = { category, item };
  document.getElementById('breadcrumb-section').textContent = CONTENT[category][item].breadcrumb;
  renderContent();
}

function renderContent() {
  const data = CONTENT[activeSection.category][activeSection.item];
  document.getElementById('tab-overview').innerHTML = data.overview;
  document.getElementById('wq-title').innerHTML = data.label + ' &ndash; Work Queue';
  const wqBody = document.getElementById('workqueue-body');
  wqBody.innerHTML = data.workqueue.map(item => `
    <div class="queue-item">
      <div>
        <div class="queue-title">${item.title}</div>
        <div class="queue-meta">${item.meta}</div>
      </div>
      <div class="queue-right">
        <span class="priority priority-${item.priority === 'high' ? 'high' : item.priority === 'med' ? 'med' : 'low'}">${item.priority === 'high' ? 'High' : item.priority === 'med' ? 'Medium' : 'Low'}</span>
        <span class="due">${item.due}</span>
      </div>
    </div>`).join('');
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function togglePill(el) {
  el.classList.toggle('active');
}

// Init
renderContent();
</script>
