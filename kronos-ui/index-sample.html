<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kronos — Sustainable Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kronos: {
              50:'#f0f4ff',100:'#dbe4ff',200:'#bac8ff',300:'#91a7ff',
              400:'#748ffc',500:'#5c7cfa',600:'#4c6ef5',700:'#4263eb',
              800:'#3b5bdb',900:'#364fc7',950:'#1e3a5f',
            },
            slate: { 850:'#172033' }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak]{display:none!important}
    .sidebar-link.active{background:rgba(92,124,250,.15);color:#748ffc}
    .sidebar-link:hover:not(.active){background:rgba(255,255,255,.05)}
    .stat-card{transition:transform .15s ease,box-shadow .15s ease}
    .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px -5px rgba(0,0,0,.25)}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:.75rem;font-weight:500}
    .badge-active{background:rgba(16,185,129,.15);color:#34d399}
    .badge-inactive{background:rgba(107,114,128,.15);color:#9ca3af}
    .badge-deprecated{background:rgba(239,68,68,.15);color:#f87171}
    .badge-pending{background:rgba(245,158,11,.15);color:#fbbf24}
    .badge-under_review{background:rgba(59,130,246,.15);color:#60a5fa}
    .badge-open{background:rgba(245,158,11,.15);color:#fbbf24}
    .badge-closed{background:rgba(107,114,128,.15);color:#9ca3af}
    .badge-in_progress{background:rgba(59,130,246,.15);color:#60a5fa}
    .badge-low{background:rgba(16,185,129,.15);color:#34d399}
    .badge-medium{background:rgba(245,158,11,.15);color:#fbbf24}
    .badge-high{background:rgba(249,115,22,.15);color:#fb923c}
    .badge-critical{background:rgba(239,68,68,.15);color:#f87171}
    .table-row{border-bottom:1px solid rgba(51,65,85,.5);transition:background .15s}
    .table-row:hover{background:rgba(30,41,59,.5)}
    .inventory-table{display:table;width:100%;table-layout:auto}
    .inventory-thead{display:table-header-group}
    .inventory-row{display:table-row}
    .inventory-cell{display:table-cell;vertical-align:middle}
    .card{background:rgba(30,41,59,.6);backdrop-filter:blur(8px);border:1px solid rgba(51,65,85,.5);border-radius:.75rem}
    .input-field{background:#1e293b;border:1px solid #475569;color:#e2e8f0;border-radius:.5rem;padding:.5rem .75rem;outline:none}
    .input-field:focus{box-shadow:0 0 0 2px #5c7cfa;border-color:transparent}
    .input-field::placeholder{color:#64748b}
    .btn-primary{background:#4c6ef5;color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-weight:500;transition:background .15s;cursor:pointer;border:none}
    .btn-primary:hover{background:#4263eb}
    .btn-secondary{background:#334155;color:#e2e8f0;padding:.5rem 1rem;border-radius:.5rem;font-weight:500;transition:background .15s;cursor:pointer;border:none}
    .btn-secondary:hover{background:#475569}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease-out}
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-200 antialiased" x-data="kronos()" x-init="init()">
<div class="flex h-full">

  <!-- Sidebar -->
  <aside class="flex flex-col w-64 min-h-screen border-r border-slate-700/50" style="background:#172033;transition:width .2s" :style="sidebarOpen?'width:16rem':'width:4rem'">
    <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700/50">
      <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-kronos-600 text-white font-bold text-lg shrink-0">K</div>
      <span class="text-lg font-semibold tracking-tight text-white" x-show="sidebarOpen" x-cloak>Kronos</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <p class="px-3 mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-500" x-show="sidebarOpen">Overview</p>
      <a href="#dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='dashboard'&&'active'">
        <i class="fa-solid fa-chart-line w-5 text-center"></i><span x-show="sidebarOpen">Dashboard</span></a>
      <a href="#search" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='search'&&'active'">
        <i class="fa-solid fa-magnifying-glass w-5 text-center"></i><span x-show="sidebarOpen">Search & Discovery</span></a>

      <p class="px-3 mt-5 mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-500" x-show="sidebarOpen">Inventory</p>
      <a href="#vendors" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='vendors'&&'active'">
        <i class="fa-solid fa-building w-5 text-center"></i><span x-show="sidebarOpen">Vendors</span></a>
      <a href="#trackers" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='trackers'&&'active'">
        <i class="fa-solid fa-satellite-dish w-5 text-center"></i><span x-show="sidebarOpen">Digital Trackers</span></a>
      <a href="#systems" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='systems'&&'active'">
        <i class="fa-solid fa-server w-5 text-center"></i><span x-show="sidebarOpen">Systems</span></a>
      <a href="#use_cases" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='use_cases'&&'active'">
        <i class="fa-solid fa-diagram-project w-5 text-center"></i><span x-show="sidebarOpen">Business Use Cases</span></a>

      <p class="px-3 mt-5 mb-2 text-[10px] font-semibold uppercase tracking-widest text-slate-500" x-show="sidebarOpen">Governance</p>
      <a href="#register" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='register'&&'active'">
        <i class="fa-solid fa-plus-circle w-5 text-center"></i><span x-show="sidebarOpen">Register Asset</span></a>
      <a href="#relationships" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='relationships'&&'active'">
        <i class="fa-solid fa-circle-nodes w-5 text-center"></i><span x-show="sidebarOpen">Relationships</span></a>
      <a href="#reports" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='reports'&&'active'">
        <i class="fa-solid fa-file-lines w-5 text-center"></i><span x-show="sidebarOpen">Reports & Audits</span></a>
      <a href="#legal_exceptions" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300" :class="page==='legal_exceptions'&&'active'">
        <i class="fa-solid fa-scale-balanced w-5 text-center"></i><span x-show="sidebarOpen">Legal Exceptions</span></a>
    </nav>
    <div class="px-4 py-3 border-t border-slate-700/50 text-xs text-slate-500" x-show="sidebarOpen">
      <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> STATIC FILE</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-700/50 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
      <div class="flex items-center gap-4">
        <button @click="sidebarOpen=!sidebarOpen" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-bars"></i></button>
        <h1 class="text-lg font-semibold" x-text="pageTitle"></h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input type="text" placeholder="Search all assets…" class="input-field pl-9 w-72 text-sm"
                 @keydown.enter="searchQuery=$event.target.value;page='search';window.location.hash='search'"
                 @keydown.meta.k.window.prevent="$el.focus()" @keydown.ctrl.k.window.prevent="$el.focus()">
        </div>
        <div class="w-8 h-8 rounded-full bg-kronos-600 flex items-center justify-center text-white text-sm font-semibold">JF</div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 fade-in" :key="page+detailId">

      <!-- ==================== DASHBOARD ==================== -->
      <template x-if="page==='dashboard'">
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <template x-for="c in [
              {label:'Vendors',key:'vendors',icon:'fa-building',color:'violet',href:'#vendors'},
              {label:'Digital Trackers',key:'trackers',icon:'fa-satellite-dish',color:'cyan',href:'#trackers'},
              {label:'Systems',key:'systems',icon:'fa-server',color:'emerald',href:'#systems'},
              {label:'Business Use Cases',key:'use_cases',icon:'fa-diagram-project',color:'amber',href:'#use_cases'}
            ]">
              <a :href="c.href" class="stat-card card p-5 block">
                <div class="flex items-center justify-between mb-3">
                  <span class="text-sm font-medium text-slate-400" x-text="c.label"></span>
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center" :class="'bg-'+c.color+'-500/15'">
                    <i class="fa-solid" :class="c.icon+' text-'+c.color+'-400'"></i>
                  </div>
                </div>
                <p class="text-3xl font-bold text-white" x-text="DATA[c.key].length"></p>
                <p class="text-xs text-slate-500 mt-1" x-text="DATA[c.key].filter(i=>i.status==='active').length+' active'"></p>
              </a>
            </template>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="card p-5">
              <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-slate-400">Legal Exceptions</span><i class="fa-solid fa-scale-balanced text-slate-500"></i></div>
              <p class="text-2xl font-bold text-white" x-text="DATA.legal_exceptions.length"></p>
              <p class="text-xs text-slate-500 mt-1" x-text="DATA.legal_exceptions.filter(e=>e.status==='active').length+' active'"></p>
            </div>
            <div class="card p-5">
              <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-slate-400">Prior Audits</span><i class="fa-solid fa-clipboard-check text-slate-500"></i></div>
              <p class="text-2xl font-bold text-white" x-text="DATA.prior_audits.length"></p>
              <p class="text-xs text-slate-500 mt-1" x-text="DATA.prior_audits.filter(a=>a.status==='open'||a.status==='in_progress').length+' open'"></p>
            </div>
            <div class="card p-5">
              <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium text-slate-400">Total Relationships</span><i class="fa-solid fa-circle-nodes text-slate-500"></i></div>
              <p class="text-2xl font-bold text-white" x-text="totalRelationships()"></p>
              <p class="text-xs text-slate-500 mt-1">M:M asset connections</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card">
              <div class="px-5 py-4 border-b border-slate-700/50"><h2 class="font-semibold">Recent Activity</h2></div>
              <div class="divide-y divide-slate-700/30 max-h-80 overflow-y-auto">
                <template x-for="log in DATA.change_log.slice(0,10)" :key="log.asset_id+log.timestamp">
                  <div class="px-5 py-3 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"
                         :class="log.action==='created'?'bg-emerald-500/15 text-emerald-400':log.action==='updated'?'bg-blue-500/15 text-blue-400':'bg-red-500/15 text-red-400'">
                      <i class="fa-solid" :class="log.action==='created'?'fa-plus':log.action==='updated'?'fa-pen':'fa-xmark'"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm"><span class="font-medium text-white" x-text="log.changed_by||'System'"></span>
                        <span x-text="' '+log.action+' '+log.asset_type+' '"></span><span class="text-kronos-400" x-text="log.asset_id"></span></p>
                      <p class="text-xs text-slate-500" x-text="log.change_summary||''"></p>
                    </div>
                    <span class="text-xs text-slate-500 whitespace-nowrap" x-text="log.timestamp.substring(0,10)"></span>
                  </div>
                </template>
              </div>
            </div>
            <div class="card">
              <div class="px-5 py-4 border-b border-slate-700/50"><h2 class="font-semibold">Assets by Status</h2></div>
              <div class="p-5 space-y-4">
                <template x-for="[st,cnt] in Object.entries(statusBreakdown())" :key="st">
                  <div>
                    <div class="flex justify-between text-sm mb-1"><span class="capitalize" x-text="st"></span><span class="text-slate-400" x-text="cnt"></span></div>
                    <div class="w-full bg-slate-700/50 rounded-full h-2">
                      <div class="h-2 rounded-full" :class="st==='active'?'bg-emerald-500':st==='deprecated'?'bg-red-500':st==='pending'?'bg-amber-500':'bg-blue-500'"
                           :style="'width:'+((cnt/totalAssets())*100)+'%'"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <template x-if="highRiskVendors().length">
            <div class="card">
              <div class="px-5 py-4 border-b border-slate-700/50 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-amber-400"></i><h2 class="font-semibold">High-Risk Vendors Requiring Attention</h2>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead><tr class="text-left text-xs text-slate-400 uppercase tracking-wider border-b border-slate-700/50">
                    <th class="px-5 py-3">Vendor</th><th class="px-5 py-3">Category</th><th class="px-5 py-3">Risk</th><th class="px-5 py-3">DPA</th><th class="px-5 py-3">Contract Expiry</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="v in highRiskVendors()" :key="v.asset_id">
                      <tr class="table-row">
                        <td class="px-5 py-3"><a :href="'#detail/vendor/'+v.asset_id" class="text-kronos-400 hover:text-kronos-300 font-medium" x-text="v.name"></a></td>
                        <td class="px-5 py-3 text-slate-400" x-text="v.vendor_category||'\u2014'"></td>
                        <td class="px-5 py-3"><span class="badge" :class="'badge-'+v.risk_rating" x-text="v.risk_rating"></span></td>
                        <td class="px-5 py-3"><span :class="v.dpa_in_place?'text-emerald-400':'text-red-400'"><i class="fa-solid" :class="v.dpa_in_place?'fa-check':'fa-xmark'"></i></span></td>
                        <td class="px-5 py-3 text-slate-400" x-text="v.contract_expiry||'\u2014'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ==================== SEARCH ==================== -->
      <template x-if="page==='search'">
        <div class="space-y-6">
          <div class="card p-8 text-center">
            <h2 class="text-2xl font-bold text-white mb-2">Find Any Asset</h2>
            <p class="text-slate-400 mb-6 max-w-lg mx-auto">Search across vendors, trackers, systems, and business use cases. Discover relationships and dependencies instantly.</p>
            <div class="max-w-2xl mx-auto">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" x-model="searchQuery" @keydown.enter="runSearch()" autofocus
                       placeholder='e.g. "Adobe", "audience segments", "purchase propensity"'
                       class="input-field pl-12 pr-4 py-3.5 w-full text-base" style="border-radius:.75rem">
              </div>
              <div class="flex flex-wrap justify-center gap-3 mt-4">
                <label class="flex items-center gap-1.5 text-sm text-slate-400 cursor-pointer"><input type="checkbox" x-model="searchTypes" value="vendor" class="rounded"> Vendors</label>
                <label class="flex items-center gap-1.5 text-sm text-slate-400 cursor-pointer"><input type="checkbox" x-model="searchTypes" value="tracker" class="rounded"> Trackers</label>
                <label class="flex items-center gap-1.5 text-sm text-slate-400 cursor-pointer"><input type="checkbox" x-model="searchTypes" value="system" class="rounded"> Systems</label>
                <label class="flex items-center gap-1.5 text-sm text-slate-400 cursor-pointer"><input type="checkbox" x-model="searchTypes" value="use_case" class="rounded"> Use Cases</label>
                <button @click="runSearch()" class="btn-primary text-sm ml-2">Search</button>
              </div>
            </div>
          </div>

          <template x-if="searchQuery && searchResults !== null">
            <div>
              <p class="text-sm text-slate-400 mb-4">Found <span class="text-white font-medium" x-text="searchResults.length"></span> results for "<span class="text-kronos-400" x-text="searchQuery"></span>"</p>
              <template x-if="searchResults.length">
                <div class="space-y-3">
                  <template x-for="r in searchResults" :key="r.asset_id">
                    <a :href="'#detail/'+r.type+'/'+r.asset_id" class="card p-4 flex items-start gap-4 hover:border-kronos-600/40 transition-colors block cursor-pointer">
                      <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0"
                           :class="typeColor(r.type,'bg')">
                        <i class="fa-solid" :class="typeIcon(r.type)+' '+typeColor(r.type,'text')"></i>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                          <span class="font-medium text-white" x-text="r.name"></span>
                          <span class="badge" :class="'badge-'+r.status" x-text="r.status"></span>
                          <span class="text-xs text-slate-500 font-mono" x-text="r.asset_id"></span>
                        </div>
                        <p class="text-sm text-slate-400 truncate" x-text="r.description||'No description'"></p>
                        <div class="flex items-center gap-3 mt-2 text-xs text-slate-500">
                          <span class="capitalize" x-text="r.type.replace('_',' ')"></span>
                          <span x-show="r.owner" x-text="'Owner: '+r.owner"></span>
                        </div>
                      </div>
                      <i class="fa-solid fa-chevron-right text-slate-600 mt-3"></i>
                    </a>
                  </template>
                </div>
              </template>
              <template x-if="!searchResults.length">
                <div class="card p-12 text-center">
                  <i class="fa-solid fa-magnifying-glass text-4xl text-slate-600 mb-4"></i>
                  <p class="text-slate-400">No results found for "<span x-text="searchQuery"></span>".</p>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!searchQuery || searchResults===null">
            <div class="card p-6">
              <h3 class="font-semibold mb-4">Example Queries</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <template x-for="q in exampleQueries" :key="q">
                  <a href="#" @click.prevent="searchQuery=q;runSearch()" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-700/30 hover:bg-slate-700/60 transition-colors text-sm cursor-pointer">
                    <i class="fa-solid fa-arrow-right text-kronos-400 text-xs"></i>
                    <span class="text-slate-300" x-text="q"></span>
                  </a>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ==================== INVENTORY (vendors/trackers/systems/use_cases) ==================== -->
      <template x-if="['vendors','trackers','systems','use_cases'].includes(page)">
        <div class="space-y-4" x-effect="inventoryItems = filteredItems(); invPage = 0">
          <div class="card p-4">
            <div class="flex flex-wrap items-center gap-3">
              <div class="relative flex-1 min-w-[200px]">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" x-model="filterText" :placeholder="'Filter '+pageTitle.toLowerCase()+'…'" class="input-field pl-9 w-full text-sm">
              </div>
              <button @click="showFilters=!showFilters" class="btn-secondary text-sm flex items-center gap-2"><i class="fa-solid fa-filter"></i> Filters</button>
              <div class="flex items-center gap-2 ml-auto">
                <button @click="exportCsv(page)" class="btn-secondary text-sm flex items-center gap-2"><i class="fa-solid fa-download"></i> Export CSV</button>
              </div>
            </div>
            <div x-show="showFilters" x-cloak class="mt-4 pt-4 border-t border-slate-700/50 flex flex-wrap gap-3 items-end">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Status</label>
                <select x-model="filterStatus" class="input-field text-sm">
                  <option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option>
                  <option value="deprecated">Deprecated</option><option value="pending">Pending</option><option value="under_review">Under Review</option>
                </select>
              </div>
              <div x-show="page==='vendors'">
                <label class="block text-xs text-slate-400 mb-1">Risk Rating</label>
                <select x-model="filterRisk" class="input-field text-sm">
                  <option value="">All</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Owner</label>
                <select x-model="filterOwner" class="input-field text-sm">
                  <option value="">All</option>
                  <template x-for="o in uniqueOwners(page)" :key="o"><option :value="o" x-text="o"></option></template>
                </select>
              </div>
            </div>
          </div>

function kronos() {
  return {
    sidebarOpen: true,
    page: 'dashboard',
    detailType: '',
    detailId: '',
    searchQuery: '',
    searchResults: null,
    searchTypes: ['vendor','tracker','system','use_case'],
    filterText: '',
    filterStatus: '',
    filterRisk: '',
    filterOwner: '',
    showFilters: false,
    sortField: 'name',
    sortDir: 'asc',
    relType: 'use_case',
    relId: '',
    inventoryItems: [],
    invPage: 0,
    invPageSize: 50,
    exampleQueries: [
      "Which platforms use Adobe's systems & trackers?",
      "Trackers used for purchase propensity",
      "Vendors with high risk rating",
      "Systems that store subscriber data",
      "EMEA region use cases",
      "Consent-required trackers on Disney+"
    ],

    get pageTitle() {
      const m = {dashboard:'Dashboard',search:'Search & Discovery',vendors:'Vendors',trackers:'Digital Trackers',systems:'Systems',use_cases:'Business Use Cases',detail:'Asset Detail',register:'Register Asset',relationships:'Relationship Explorer',reports:'Reports & Audits',legal_exceptions:'Legal Exceptions'};
      return m[this.page]||'Kronos';
    },

    init() {
      this.route();
      window.addEventListener('hashchange', () => this.route());
    },

    route() {
      const h = window.location.hash.replace('#','') || 'dashboard';
      const parts = h.split('/');
      this.filterText = '';
      this.filterStatus = '';
      this.filterRisk = '';
      this.filterOwner = '';
      if (parts[0] === 'detail' && parts.length === 3) {
        this.page = 'detail';
        this.detailType = parts[1];
        this.detailId = parts[2];
      } else {
        this.page = parts[0];
        this.detailType = '';
        this.detailId = '';
      }
      this.inventoryItems = this.filteredItems();
      this.invPage = 0;
    },

    typeIcon(t) { return {vendor:'fa-building',tracker:'fa-satellite-dish',system:'fa-server',use_case:'fa-diagram-project'}[t]||'fa-cube'; },
    typeColor(t, mode) {
      const c = {vendor:'violet',tracker:'cyan',system:'emerald',use_case:'amber'}[t]||'slate';
      return mode==='bg' ? 'bg-'+c+'-500/15' : 'text-'+c+'-400';
    },
    singularType(p) { return {vendors:'vendor',trackers:'tracker',systems:'system',use_cases:'use_case'}[p]||p; },
    pluralType(s) { return {vendor:'vendors',tracker:'trackers',system:'systems',use_case:'use_cases'}[s]||s; },

    vendorName(vid) {
      if (!vid) return null;
      const v = DATA.vendors.find(x => x.asset_id === vid);
      return v ? v.name : null;
    },

    totalAssets() { return DATA.vendors.length + DATA.trackers.length + DATA.systems.length + DATA.use_cases.length; },

    statusBreakdown() {
      const counts = {};
      ['vendors','trackers','systems','use_cases'].forEach(k => DATA[k].forEach(i => { const s = i.status||'active'; counts[s] = (counts[s]||0)+1; }));
      return counts;
    },

    highRiskVendors() { return DATA.vendors.filter(v => v.risk_rating==='high'||v.risk_rating==='critical'); },

    totalRelationships() {
      let c = 0;
      DATA.use_cases.forEach(uc => { c += (uc.vendors||[]).length + (uc.trackers||[]).length + (uc.systems||[]).length; });
      return c;
    },

    uniqueOwners(pg) {
      const items = DATA[pg] || [];
      return [...new Set(items.map(i=>i.owner).filter(Boolean))].sort();
    },

    filteredItems() {
      let items = [...(DATA[this.page]||[])];
      const q = this.filterText.toLowerCase();
      if (q) items = items.filter(i => JSON.stringify(i).toLowerCase().includes(q));
      if (this.filterStatus) items = items.filter(i => i.status === this.filterStatus);
      if (this.filterOwner) items = items.filter(i => i.owner === this.filterOwner);
      if (this.page === 'vendors' && this.filterRisk) items = items.filter(i => i.risk_rating === this.filterRisk);
      items.sort((a,b) => {
        const av = (a[this.sortField]||'').toString().toLowerCase();
        const bv = (b[this.sortField]||'').toString().toLowerCase();
        return this.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      });
      return items;
    },

    toggleSort(field) {
      if (this.sortField === field) this.sortDir = this.sortDir==='asc'?'desc':'asc';
      else { this.sortField = field; this.sortDir = 'asc'; }
      this.invPage = 0;
    },
    paginatedItems() {
      const start = this.invPage * this.invPageSize;
      return (this.inventoryItems || []).slice(start, start + this.invPageSize);
    },
    invTotalPages() {
      return Math.ceil((this.inventoryItems || []).length / this.invPageSize) || 1;
    },

    runSearch() {
      if (!this.searchQuery.trim()) { this.searchResults = null; return; }
      const q = this.searchQuery.toLowerCase();
      const results = [];
      const types = this.searchTypes.length ? this.searchTypes : ['vendor','tracker','system','use_case'];

      if (types.includes('vendor')) DATA.vendors.forEach(v => {
        if ([v.name,v.description,v.vendor_category,v.vendor_type].some(f=>(f||'').toLowerCase().includes(q)))
          results.push({...v, type:'vendor'});
      });
      if (types.includes('tracker')) DATA.trackers.forEach(t => {
        if ([t.name,t.purpose,t.domain_or_platform].some(f=>(f||'').toLowerCase().includes(q)))
          results.push({...t, type:'tracker'});
      });
      if (types.includes('system')) DATA.systems.forEach(s => {
        if ([s.name,s.description,s.business_unit,s.system_type].some(f=>(f||'').toLowerCase().includes(q)))
          results.push({...s, type:'system'});
      });
      if (types.includes('use_case')) DATA.use_cases.forEach(u => {
        if ([u.name,u.description,u.category,u.subcategory].some(f=>(f||'').toLowerCase().includes(q)))
          results.push({...u, type:'use_case'});
      });
      this.searchResults = results;
    },

    detailAsset() {
      const list = DATA[this.pluralType(this.detailType)] || [];
      return list.find(a => a.asset_id === this.detailId) || null;
    },

    detailProperties() {
      const a = this.detailAsset(); if (!a) return [];
      if (this.detailType==='vendor') return [['Vendor Type',a.vendor_type],['Category',a.vendor_category],['Risk Rating',a.risk_rating],['DPA In Place',a.dpa_in_place?'Yes':'No'],['Contract Expiry',a.contract_expiry],['Data Shared',a.data_shared],['Subprocessors',a.subprocessors]];
      if (this.detailType==='tracker') return [['Tracker Type',a.tracker_type],['Platform',a.domain_or_platform],['Purpose',a.purpose],['Data Collected',a.data_collected],['Placement',a.placement],['Consent Required',a.consent_required?'Yes':'No'],['Retention Period',a.retention_period],['Vendor',this.vendorName(a.vendor_id)]];
      if (this.detailType==='system') return [['System Type',a.system_type],['Business Unit',a.business_unit],['Data Classification',a.data_classification],['Hosting',a.hosting],['PII Processed',a.pii_processed?'Yes':'No'],['Certifications',a.certifications],['Vendor',this.vendorName(a.vendor_id)]];
      if (this.detailType==='use_case') return [['Category',a.category],['Subcategory',a.subcategory],['Legal Basis',a.legal_basis],['Data Flow',a.data_flow],['Retention',a.retention],['Cross-Border',a.cross_border?'Yes':'No']];
      return [];
    },

    detailRelated() {
      const a = this.detailAsset(); if (!a) return [];
      const rels = [];
      if (this.detailType === 'use_case') {
        (a.vendors||[]).forEach(vid => { const v=DATA.vendors.find(x=>x.asset_id===vid); if(v) rels.push({type:'vendor',...v}); });
        (a.systems||[]).forEach(sid => { const s=DATA.systems.find(x=>x.asset_id===sid); if(s) rels.push({type:'system',...s}); });
        (a.trackers||[]).forEach(tid => { const t=DATA.trackers.find(x=>x.asset_id===tid); if(t) rels.push({type:'tracker',...t}); });
      } else if (this.detailType === 'vendor') {
        DATA.use_cases.filter(uc=>(uc.vendors||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        DATA.trackers.filter(t=>t.vendor_id===a.asset_id).forEach(t=>rels.push({type:'tracker',...t}));
        DATA.systems.filter(s=>s.vendor_id===a.asset_id).forEach(s=>rels.push({type:'system',...s}));
      } else if (this.detailType === 'system') {
        DATA.use_cases.filter(uc=>(uc.systems||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        if (a.vendor_id) { const v=DATA.vendors.find(x=>x.asset_id===a.vendor_id); if(v) rels.push({type:'vendor',...v}); }
      } else if (this.detailType === 'tracker') {
        DATA.use_cases.filter(uc=>(uc.trackers||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        if (a.vendor_id) { const v=DATA.vendors.find(x=>x.asset_id===a.vendor_id); if(v) rels.push({type:'vendor',...v}); }
      }
      return rels;
    },

    detailChangeLogs() {
      return DATA.change_log.filter(l => l.asset_id === this.detailId);
    },

    relAsset() {
      const list = DATA[this.pluralType(this.relType)] || [];
      return list.find(a => a.asset_id === this.relId) || null;
    },

    relGroups() {
      const a = this.relAsset(); if (!a) return {};
      const groups = {};
      const rels = [];
      if (this.relType === 'use_case') {
        (a.vendors||[]).forEach(vid => { const v=DATA.vendors.find(x=>x.asset_id===vid); if(v) rels.push({type:'vendor',...v}); });
        (a.systems||[]).forEach(sid => { const s=DATA.systems.find(x=>x.asset_id===sid); if(s) rels.push({type:'system',...s}); });
        (a.trackers||[]).forEach(tid => { const t=DATA.trackers.find(x=>x.asset_id===tid); if(t) rels.push({type:'tracker',...t}); });
      } else if (this.relType === 'vendor') {
        DATA.use_cases.filter(uc=>(uc.vendors||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        DATA.trackers.filter(t=>t.vendor_id===a.asset_id).forEach(t=>rels.push({type:'tracker',...t}));
        DATA.systems.filter(s=>s.vendor_id===a.asset_id).forEach(s=>rels.push({type:'system',...s}));
      } else if (this.relType === 'system') {
        DATA.use_cases.filter(uc=>(uc.systems||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        if (a.vendor_id) { const v=DATA.vendors.find(x=>x.asset_id===a.vendor_id); if(v) rels.push({type:'vendor',...v}); }
      } else if (this.relType === 'tracker') {
        DATA.use_cases.filter(uc=>(uc.trackers||[]).includes(a.asset_id)).forEach(uc=>rels.push({type:'use_case',...uc}));
        if (a.vendor_id) { const v=DATA.vendors.find(x=>x.asset_id===a.vendor_id); if(v) rels.push({type:'vendor',...v}); }
      }
      rels.forEach(r => { if (!groups[r.type]) groups[r.type]=[]; groups[r.type].push(r); });
      return groups;
    },

    relCount(type) {
      let c = 0;
      DATA.use_cases.forEach(uc => c += (uc[type]||[]).length);
      return c;
    },

    exportCsv(key) {
      let rows = [];
      if (key === 'vendors') {
        rows.push(['ID','Name','Type','Category','Risk','DPA','Owner','Status','Contract Expiry']);
        DATA.vendors.forEach(v => rows.push([v.asset_id,v.name,v.vendor_type,v.vendor_category,v.risk_rating,v.dpa_in_place,v.owner,v.status,v.contract_expiry]));
      } else if (key === 'trackers') {
        rows.push(['ID','Name','Type','Platform','Purpose','Vendor','Consent','Owner','Status']);
        DATA.trackers.forEach(t => rows.push([t.asset_id,t.name,t.tracker_type,t.domain_or_platform,t.purpose,this.vendorName(t.vendor_id),t.consent_required,t.owner,t.status]));
      } else if (key === 'systems') {
        rows.push(['ID','Name','Type','Business Unit','Classification','PII','Owner','Status']);
        DATA.systems.forEach(s => rows.push([s.asset_id,s.name,s.system_type,s.business_unit,s.data_classification,s.pii_processed,s.owner,s.status]));
      } else if (key === 'use_cases') {
        rows.push(['ID','Name','Category','Subcategory','Legal Basis','Cross-Border','Owner','Status']);
        DATA.use_cases.forEach(u => rows.push([u.asset_id,u.name,u.category,u.subcategory,u.legal_basis,u.cross_border,u.owner,u.status]));
      } else {
        rows.push(['Asset Type','ID','Name','Owner','Status']);
        [['Vendor','vendors'],['Tracker','trackers'],['System','systems'],['UseCase','use_cases']].forEach(([label,k]) =>
          DATA[k].forEach(a => rows.push([label,a.asset_id,a.name,a.owner,a.status]))
        );
      }
      const csv = rows.map(r => r.map(c => '"'+(c==null?'':String(c).replace(/"/g,'""'))+'"').join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kronos_'+key+'_'+new Date().toISOString().substring(0,10)+'.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
  };
}
</script>
</body>
</html>
